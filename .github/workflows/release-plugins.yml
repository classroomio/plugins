name: Release plugins

on:
  push:
    branches:
      - main

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: plugin-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: plugin-production
    env:
      CLASSROOMIO_API_URL: ${{ secrets.CLASSROOMIO_API_URL }}
      PLUGIN_ASSET_BUCKET: ${{ vars.PLUGIN_ASSET_BUCKET }}
      PLUGIN_RELEASE_DEPLOY_TOKEN: ${{ secrets.PLUGIN_RELEASE_DEPLOY_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RELEASE_BASE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: classroomio/classroomio
          ref: d0d2453b973b8045a9e470640d963f47e4f31803
          path: core
      - name: Link pinned ClassroomIO boundary packages
        run: ln -s "$GITHUB_WORKSPACE/core" "$GITHUB_WORKSPACE/../classroomio"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build pinned boundary packages
        working-directory: core
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @classroomio/plugin-sdk build
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm run pack
      - run: pnpm release:verify
      - name: Save first-build digests
        run: node -e "const i=require('./.plugin-artifacts/release-index.json'); console.log(JSON.stringify(i.releases.map(({pluginId,version,artifactDigest})=>({pluginId,version,artifactDigest}))))" > /tmp/plugin-digests.json
      - name: Rebuild trusted artifacts and prove determinism
        run: |
          rm -rf .plugin-artifacts
          pnpm run pack
          pnpm release:verify
          node -e "const fs=require('fs'); const i=require('./.plugin-artifacts/release-index.json'); const actual=JSON.stringify(i.releases.map(({pluginId,version,artifactDigest})=>({pluginId,version,artifactDigest}))); const expected=fs.readFileSync('/tmp/plugin-digests.json','utf8').trim(); if(actual!==expected) process.exit(1)"
      - name: Create trusted release request
        id: candidates
        run: |
          count="$(pnpm --silent release:request)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Upload immutable artifacts
        if: steps.candidates.outputs.count != '0'
        run: node scripts/upload-release.mjs
      - name: Attest release archives
        if: steps.candidates.outputs.count != '0'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: .plugin-artifacts/**/*.tar.gz
      - name: Register approved releases
        if: steps.candidates.outputs.count != '0'
        run: node scripts/register-release.mjs
      - name: Release summary
        if: steps.candidates.outputs.count != '0'
        run: cat .plugin-artifacts/release-request.json >> "$GITHUB_STEP_SUMMARY"
