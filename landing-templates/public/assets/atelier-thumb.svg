<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" fill="none">
  <!-- Linen warm paper canvas -->
  <rect width="360" height="220" rx="8" fill="#FBF9F4"/>
  <rect x="0.5" y="0.5" width="359" height="219" rx="7.5" stroke="#E7E5E4" stroke-width="1"/>
  
  <!-- Subtle top bar -->
  <line x1="24" y1="44" x2="336" y2="44" stroke="#D6D3D1" stroke-width="0.75"/>
  <rect x="24" y="24" width="75" height="10" rx="1" fill="#1C1917"/>
  <rect x="230" y="26" width="36" height="6" rx="1" fill="#78716C"/>
  <rect x="280" y="26" width="46" height="6" rx="1" fill="#C2410C"/>

  <!-- Kicker / Volume tag -->
  <rect x="24" y="60" width="110" height="6" rx="1" fill="#A8A29E"/>

  <!-- Serif Hero Headline -->
  <rect x="24" y="74" width="220" height="15" rx="1" fill="#1C1917"/>
  <rect x="24" y="94" width="170" height="12" rx="1" fill="#1C1917"/>
  <rect x="24" y="114" width="200" height="8" rx="1" fill="#78716C"/>

  <!-- Editorial actions -->
  <rect x="24" y="132" width="88" height="22" rx="2" fill="#1C1917"/>
  <rect x="36" y="140" width="64" height="6" rx="1" fill="#FBF9F4"/>
  <rect x="124" y="140" width="60" height="6" rx="1" fill="#78716C"/>

  <!-- Book jacket card layout -->
  <rect x="256" y="60" width="80" height="100" rx="3" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <rect x="264" y="68" width="64" height="34" rx="2" fill="#E7E5E4"/>
  <rect x="264" y="110" width="56" height="6" rx="1" fill="#1C1917"/>
  <rect x="264" y="122" width="40" height="5" rx="1" fill="#A8A29E"/>
  <rect x="264" y="142" width="28" height="6" rx="1" fill="#C2410C"/>

  <!-- Bottom hairline -->
  <line x1="24" y1="180" x2="336" y2="180" stroke="#D6D3D1" stroke-width="0.75"/>
  <rect x="24" y="192" width="80" height="6" rx="1" fill="#A8A29E"/>
  <rect x="290" y="192" width="46" height="6" rx="1" fill="#A8A29E"/>
</svg>

