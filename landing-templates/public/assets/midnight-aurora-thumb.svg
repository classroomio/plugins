<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" fill="none">
  <!-- Obsidian dark canvas -->
  <rect width="360" height="220" rx="8" fill="#090A0F"/>
  
  <!-- Aurora mesh glows -->
  <circle cx="100" cy="80" r="90" fill="#6366F1" fill-opacity="0.25" filter="blur(30px)"/>
  <circle cx="260" cy="120" r="80" fill="#06B6D4" fill-opacity="0.22" filter="blur(30px)"/>
  <circle cx="180" cy="180" r="70" fill="#A855F7" fill-opacity="0.18" filter="blur(25px)"/>

  <!-- Nav bar -->
  <rect x="20" y="18" width="320" height="32" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <circle cx="38" cy="34" r="6" fill="#22D3EE"/>
  <rect x="52" y="31" width="60" height="6" rx="2" fill="#E2E8F0"/>
  <rect x="272" y="24" width="56" height="20" rx="10" fill="#6366F1"/>
  <rect x="282" y="31" width="36" height="6" rx="2" fill="#FFFFFF"/>

  <!-- Centered Hero -->
  <rect x="135" y="66" width="90" height="12" rx="6" fill="rgba(34, 211, 238, 0.15)" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1"/>
  <rect x="145" y="70" width="70" height="4" rx="1" fill="#22D3EE"/>
  
  <rect x="60" y="88" width="240" height="16" rx="3" fill="#FFFFFF"/>
  <rect x="90" y="110" width="180" height="8" rx="2" fill="#94A3B8"/>

  <!-- CTA buttons -->
  <rect x="110" y="130" width="68" height="22" rx="11" fill="#22D3EE"/>
  <rect x="122" y="137" width="44" height="6" rx="2" fill="#090A0F"/>
  <rect x="186" y="130" width="64" height="22" rx="11" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <rect x="198" y="138" width="40" height="6" rx="2" fill="#E2E8F0"/>

  <!-- Glass cards row -->
  <rect x="30" y="165" width="92" height="45" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  <rect x="40" y="175" width="50" height="6" rx="2" fill="#FFFFFF"/>
  <rect x="40" y="187" width="30" height="5" rx="2" fill="#22D3EE"/>

  <rect x="134" y="165" width="92" height="45" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  <rect x="144" y="175" width="56" height="6" rx="2" fill="#FFFFFF"/>
  <rect x="144" y="187" width="30" height="5" rx="2" fill="#A855F7"/>

  <rect x="238" y="165" width="92" height="45" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  <rect x="248" y="175" width="48" height="6" rx="2" fill="#FFFFFF"/>
  <rect x="248" y="187" width="30" height="5" rx="2" fill="#38BDF8"/>
</svg>

